<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kalc Clone">
    <link rel="manifest" href="manifest.json">
    <title>Calcul Mental</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #1c1c1e;
            --text: #ffffff;
            --accent: #0a84ff;
            --success: #30d158;
            --key-bg: #2c2c2e;
            --key-active: #3a3a3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            height: -webkit-fill-available; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        /* Barre supérieure : Sélecteur de mode & Score */
        header { 
            padding: 16px 20px 10px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            color: #8e8e93;
            font-weight: 500;
        }
        .mode-selector {
            display: flex;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 3px;
            gap: 4px;
        }
        .mode-btn {
            flex: 1;
            background: transparent;
            color: #8e8e93;
            border: none;
            padding: 8px 0;
            border-radius: 9px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: #3a3a3c;
            color: #fff;
        }

        /* Zone centrale du calcul */
        #game-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        #equation { 
            font-size: 3.6rem; 
            font-weight: 700; 
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        #input-area { 
            min-height: 4rem; 
            font-size: 3.2rem; 
            font-weight: 600; 
            color: var(--accent); 
            transition: color 0.15s;
        }

        /* Pavé numérique */
        #keyboard { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            padding: 12px 16px; 
            padding-bottom: max(20px, env(safe-area-inset-bottom)); 
            background: #141416; 
            border-top: 1px solid #242426; 
        }
        .key { 
            background: var(--key-bg); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 1.8rem; 
            font-weight: 500; 
            padding: 16px 0; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: background-color 0.1s;
        }
        .key:active { background: var(--key-active); }
        .key-action { background: #202023; color: #ff453a; font-size: 1.4rem; }
        .key-clear { color: #ff9f0a; }
    </style>
</head>
<body>

    <header>
        <div class="stats-bar">
            <span>Score : <strong id="score" style="color: #fff;">0</strong></span>
            <span id="streak">Série : 0 🔥</span>
        </div>
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('mix')">Mix</button>
            <button class="mode-btn" onclick="setMode('+')">+</button>
            <button class="mode-btn" onclick="setMode('-')">−</button>
            <button class="mode-btn" onclick="setMode('×')">×</button>
            <button class="mode-btn" onclick="setMode('÷')">÷</button>
        </div>
    </header>

    <div id="game-area">
        <div id="equation">--</div>
        <div id="input-area"></div>
    </div>

    <div id="keyboard">
        <button class="key" onclick="press('1')">1</button>
        <button class="key" onclick="press('2')">2</button>
        <button class="key" onclick="press('3')">3</button>
        <button class="key" onclick="press('4')">4</button>
        <button class="key" onclick="press('5')">5</button>
        <button class="key" onclick="press('6')">6</button>
        <button class="key" onclick="press('7')">7</button>
        <button class="key" onclick="press('8')">8</button>
        <button class="key" onclick="press('9')">9</button>
        <button class="key key-action key-clear" onclick="clearInput()">C</button>
        <button class="key" onclick="press('0')">0</button>
        <button class="key key-action" onclick="deleteLast()">⌫</button>
    </div>

    <script>
        let currentMode = 'mix';
        let correctAnswer = 0;
        let currentInput = "";
        let score = 0;
        let streak = 0;

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === mode || (mode === 'mix' && btn.innerText === 'Mix'));
            });
            generateEquation();
        }

        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateEquation() {
            let op = currentMode;
            if (op === 'mix') {
                const ops = ['+', '-', '×', '÷'];
                op = ops[Math.floor(Math.random() * ops.length)];
            }

            let a, b;
            switch (op) {
                case '+':
                    a = rand(5, 60);
                    b = rand(5, 60);
                    correctAnswer = a + b;
                    break;
                case '-':
                    a = rand(10, 99);
                    b = rand(3, a); // Pas de résultat négatif
                    correctAnswer = a - b;
                    break;
                case '×':
                    a = rand(2, 12);
                    b = rand(2, 12);
                    correctAnswer = a * b;
                    break;
                case '÷':
                    // On part du résultat pour obtenir une division parfaite sans reste
                    b = rand(2, 10);
                    correctAnswer = rand(2, 12);
                    a = b * correctAnswer;
                    break;
            }

            document.getElementById('equation').innerText = `${a} ${op} ${b}`;
            currentInput = "";
            document.getElementById('input-area').innerText = "";
        }

        function press(num) {
            if (currentInput.length < 5) {
                currentInput += num;
                updateDisplay();
                checkAnswer();
            }
        }

        function clearInput() {
            currentInput = "";
            updateDisplay();
        }

        function deleteLast() {
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('input-area').innerText = currentInput;
        }

        function checkAnswer() {
            if (parseInt(currentInput, 10) === correctAnswer) {
                // Flash vert de confirmation
                document.getElementById('input-area').style.color = 'var(--success)';
                score++;
                streak++;
                document.getElementById('score').innerText = score;
                document.getElementById('streak').innerText = `Série : ${streak} 🔥`;

                setTimeout(() => {
                    document.getElementById('input-area').style.color = 'var(--accent)';
                    generateEquation();
                }, 180);
            }
        }

        generateEquation();
    </script>
</body>
</html>
